# Render Blueprint for the "بدون هبد!" FastAPI backend.
#
# Deploy: push this project to GitHub, then in Render → New → Blueprint, select
# the repo. Render reads this file, builds the Dockerfile, and prompts you for
# the GROQ_API_KEY (marked `sync: false`, so the secret never lives in git).
#
# NOTE: Render auto-detects a Blueprint only at the REPOSITORY ROOT.
#   • Deploying the `backend/` folder as its own repo → this file is already at
#     the root; nothing to change.
#   • Deploying the whole monorepo → move this file to the repo root and add
#     `rootDir: backend` to the service below (paths stay relative to it).
services:
  - name: badon-habd-api
    type: web
    runtime: docker
    plan: free                 # free tier sleeps after ~15 min idle (cold start ~1 min)
    region: frankfurt          # pick the region closest to your players
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health   # the backend exposes GET /health
    autoDeployTrigger: commit  # redeploy automatically on push
    envVars:
      - key: GROQ_API_KEY
        sync: false            # enter this secret in the Render dashboard
